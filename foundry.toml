
# ObservationBuffer – standalone Foundry project.
#
# Compiler selection: every source, test and script file carries an exact
# `pragma solidity 0.8.24;`, so `auto_detect_solc` resolves to solc 0.8.24 for
# this project's own compilation units. `offline = true` forbids compiler
# downloads: the toolchain (forge + solc 0.8.24 in the svm cache) must already
# be installed, and no executable path is ever chosen as the compiler.

[profile.default]
src = "src"
test = "test"
script = "script"
out = "out"
libs = ["lib"]
auto_detect_solc = true
offline = true
evm_version = "cancun"
optimizer = true
optimizer_runs = 200
via_ir = false
bytecode_hash = "none"
cbor_metadata = false
ffi = false
fs_permissions = []
gas_reports = ["ObservationBuffer"]
verbosity = 2

[profile.default.fuzz]
runs = 256
seed = "0x4f4253455256"

[fmt]
line_length = 120
tab_width = 4
bracket_spacing = false
int_types = "long"
quote_style = "double"
number_underscore = "thousands"

[rpc_endpoints]
sepolia = "${SEPOLIA_RPC_URL}"
